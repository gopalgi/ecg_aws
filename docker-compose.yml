version: '3.8'
services:
  backend:
    build: ./backend
    container_name: ecg-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    container_name: ecg-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://13.61.142.44:3001
    depends_on:
      - backend
    restart: always
